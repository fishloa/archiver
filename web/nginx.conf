# archiver web container nginx config
# Auth required by default: extracts email from oauth2-proxy cookie.
# Unauthenticated browser requests are sent to /signin; unauthenticated
# API requests get a 401 JSON response. No anonymous fallthrough.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# TLS terminates at the HOST nginx (zelkova), which proxies to this container
# over plain HTTP. If every location here sets X-Forwarded-Proto from its own
# $scheme, that always evaluates to "http" (the scheme of THIS hop), clobbering
# the "https" the host nginx already forwarded. That broke SvelteKit's CSRF
# origin check: the frontend computed its own origin as http://..., which never
# matches the browser's real https:// Origin header, so every form action
# (create/update/delete user, etc.) 403'd. Preserve the incoming header when
# present; only fall back to this hop's own scheme if there is none (e.g. a
# request hitting this container directly, bypassing the host nginx).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Route the auth subrequest to whichever provider issued the session cookie.
# Apple wins if both are somehow present; neither present -> Google, whose 401
# drives the sign-in redirect.
map $cookie__oauth2_apple $auth_url {
    default  http://oauth2-proxy-google:4180/oauth2-google/auth;
    ~.+      http://oauth2-proxy-apple:4181/oauth2-apple/auth;
}

resolver 127.0.0.11 valid=10s;

set_real_ip_from 0.0.0.0/0;
real_ip_header X-Real-IP;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    absolute_redirect off;
    client_max_body_size 200m;

    # ── OAuth2 Proxy — Google (port 4180) ──
    location /oauth2-google/ {
        set $oauth2_google http://oauth2-proxy-google:4180;
        proxy_pass $oauth2_google;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2-google/auth {
        internal;
        set $oauth2_google http://oauth2-proxy-google:4180;
        proxy_pass $oauth2_google;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ── OAuth2 Proxy — Apple (port 4181) ──
    location /oauth2-apple/ {
        set $oauth2_apple http://oauth2-proxy-apple:4181;
        proxy_pass $oauth2_apple;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2-apple/auth {
        internal;
        set $oauth2_apple http://oauth2-proxy-apple:4181;
        proxy_pass $oauth2_apple;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ── Auth subrequest dispatcher — routes to whichever proxy issued the
    #    session cookie (see $auth_url map above) ──
    location = /oauth2-auth {
        internal;
        proxy_pass $auth_url;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ── Sign-in page (unprotected) ──
    location = /signin {
        try_files /signin.html =404;
    }

    # ── Sign-out — clears both provider cookies regardless of which was
    #    active, so a single link works for either provider ──
    location = /signout {
        add_header Set-Cookie "_oauth2_google=; Path=/; Domain=$host; Max-Age=0; HttpOnly; Secure; SameSite=Lax" always;
        add_header Set-Cookie "_oauth2_apple=; Path=/; Domain=$host; Max-Age=0; HttpOnly; Secure; SameSite=Lax" always;
        return 302 /signin;
    }

    # ── Open WebUI — requires login, proxies to llm-webui container ──
    # Unlike other locations (browser pages get error_page 401 = /signin;
    # API routes get the synthetic @api_401 JSON body), this one sends
    # unauthenticated users straight to Google sign-in via
    # error_page 401 = /oauth2-google/start, skipping the /signin
    # interstitial entirely.
    location /webui/ {
        auth_request /oauth2-auth;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = /oauth2-google/start?rd=$request_uri;

        proxy_pass http://192.168.16.4:3111/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    # ── Ingest + processor APIs — bearer-token gated at the backend, not here ──
    # These are the worker/scraper surface (never called by the frontend browser
    # app — confirmed no frontend code references /api/ingest or /api/processor).
    # SecurityConfig requires ROLE_PROCESSOR/ROLE_ADMIN for the mutating verbs and
    # ROLE_USER/ADMIN/PROCESSOR for GET, enforced via ProcessorTokenFilter reading
    # Authorization: Bearer <PROCESSOR_TOKEN> — identical pattern to /api/mcp/
    # below. X-Auth-Email is cleared so a spoofed header can never leak through.
    # This lets a scraper (e.g. scraper-barch) run from anywhere and reach the
    # archive over the public domain with just the processor token, rather than
    # needing to run inside the docker network.
    location /api/ingest/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Auth-Email "";
        proxy_http_version 1.1;
    }

    location /api/processor/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Auth-Email "";
        proxy_http_version 1.1;
    }

    # ── MCP endpoints — no auth, no buffering ──
    location /api/mcp/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Auth-Email "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    location = /api/records/events {
        auth_request /oauth2-auth;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = @api_401;

        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    # Worker job-event stream — deliberately not auth_request-gated here.
    # The real route is /api/processor/jobs/events (ProcessorController);
    # it's guarded at the backend by ProcessorTokenFilter, which requires
    # a valid PROCESSOR_TOKEN bearer token regardless of what nginx does.
    # Workers reach the backend directly via BACKEND_URL (http://backend:8080),
    # never through this proxy, so this location being un-gated is a
    # defensive fallback, not load-bearing.
    location = /api/processor/jobs/events {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Auth-Email "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    location @api_401 {
        default_type application/json;
        return 401 '{"error":"authentication required"}';
    }

    # ── API requests → backend, auth required ──
    location /api/ {
        auth_request /oauth2-auth;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;

        error_page 401 = @api_401;

        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_http_version 1.1;
    }

    # ── Domain verification files — must stay unauthenticated ──
    location /.well-known/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # ── All other requests → SvelteKit, auth required ──
    location / {
        auth_request /oauth2-auth;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = /signin;

        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
