# archiver web container nginx config
# Auth required by default: extracts email from oauth2-proxy cookie.
# Unauthenticated browser requests are sent to /signin; unauthenticated
# API requests get a 401 JSON response. No anonymous fallthrough.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s;

set_real_ip_from 0.0.0.0/0;
real_ip_header X-Real-IP;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    absolute_redirect off;
    client_max_body_size 200m;

    # ── OAuth2 Proxy — Google (port 4180) ──
    location /oauth2-google/ {
        set $oauth2_google http://oauth2-proxy-google:4180;
        proxy_pass $oauth2_google;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2-google/auth {
        internal;
        set $oauth2_google http://oauth2-proxy-google:4180;
        proxy_pass $oauth2_google;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ── OAuth2 Proxy — Apple (port 4181) ──
    location /oauth2-apple/ {
        set $oauth2_apple http://oauth2-proxy-apple:4181;
        proxy_pass $oauth2_apple;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2-apple/auth {
        internal;
        set $oauth2_apple http://oauth2-proxy-apple:4181;
        proxy_pass $oauth2_apple;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ── Sign-in page (unprotected) ──
    location = /signin {
        try_files /signin.html =404;
    }

    # ── Open WebUI — requires login, proxies to llm-webui container ──
    # Override server-level error_page so unauthenticated users get
    # redirected to Google sign-in instead of the default /signin page.
    location /webui/ {
        auth_request /oauth2-google/auth;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = /oauth2-google/start?rd=$request_uri;

        proxy_pass http://192.168.16.4:3111/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    # ── MCP endpoints — no auth, no buffering ──
    location /api/mcp/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Email "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    location = /api/records/events {
        auth_request /oauth2-google/auth;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = @api_401;

        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    location = /api/processor/events {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Email "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    location @api_401 {
        default_type application/json;
        return 401 '{"error":"authentication required"}';
    }

    # ── API requests → backend, auth required ──
    location /api/ {
        auth_request /oauth2-google/auth;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;

        error_page 401 = @api_401;

        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_http_version 1.1;
    }

    # ── Domain verification files — must stay unauthenticated ──
    location /.well-known/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # ── All other requests → SvelteKit, auth required ──
    location / {
        auth_request /oauth2-google/auth;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = /signin;

        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
