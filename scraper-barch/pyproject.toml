[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scraper-barch"
version = "0.1.0"
description = "Scraper for the German Bundesarchiv Invenio system (invenio.bundesarchiv.de)"
requires-python = ">=3.13"
dependencies = [
    "worker-common",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
scraper-barch = "scraper_barch.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper_barch"]
