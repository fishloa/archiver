services:
  web:
    image: dockerregistry.icomb.place/archiver/web:latest
    ports:
      - "8099:8080"
    depends_on:
      - frontend
      - oauth2-proxy-google
      - oauth2-proxy-apple
    restart: unless-stopped

  oauth2-proxy-google:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_google
      OAUTH2_PROXY_COOKIE_DOMAINS: archiver.icomb.place,archive.czernin.eu
      OAUTH2_PROXY_WHITELIST_DOMAINS: archiver.icomb.place,archive.czernin.eu
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 5m
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROXY_PREFIX: /oauth2-google
      OAUTH2_PROXY_UPSTREAM: static://200
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SESSION_STORE_TYPE: cookie
    restart: unless-stopped

  oauth2-proxy-apple:
    image: dockerregistry.icomb.place/archiver/oauth2-proxy-apple:latest
    environment:
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_KEY_P8_B64: ${APPLE_KEY_P8_B64}
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://appleid.apple.com
      OAUTH2_PROXY_CLIENT_ID: ${APPLE_CLIENT_ID}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_apple
      OAUTH2_PROXY_COOKIE_DOMAINS: archiver.icomb.place,archive.czernin.eu
      OAUTH2_PROXY_WHITELIST_DOMAINS: archiver.icomb.place,archive.czernin.eu
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Apple rejects the generic oidc default scope: `profile` is not a valid
      # Apple scope, and any scope beyond `openid` additionally requires
      # response_mode=form_post. We need `email` because the allowlist is keyed
      # on email address, so form_post is mandatory. Overriding login-url is how
      # response_mode reaches Apple — oauth2-proxy preserves query params
      # already present on the configured login URL and appends its own.
      OAUTH2_PROXY_SCOPE: "openid email"
      # OIDC discovery overwrites login-url with Apple's discovered authorization
      # endpoint, which silently drops our response_mode. Skipping discovery and
      # declaring the three endpoints explicitly is what makes it stick.
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: "https://appleid.apple.com/auth/authorize?response_mode=form_post"
      OAUTH2_PROXY_REDEEM_URL: "https://appleid.apple.com/auth/token"
      OAUTH2_PROXY_OIDC_JWKS_URL: "https://appleid.apple.com/auth/keys"
      # form_post means Apple POSTs the callback cross-site from appleid.apple.com.
      # Browsers do not send SameSite=Lax cookies on a cross-site POST, so the
      # CSRF cookie would be missing and the callback would fail. None+Secure is
      # required for Apple; the Google proxy stays on lax.
      OAUTH2_PROXY_COOKIE_SAMESITE: none
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 5m
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4181
      OAUTH2_PROXY_PROXY_PREFIX: /oauth2-apple
      OAUTH2_PROXY_UPSTREAM: static://200
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SESSION_STORE_TYPE: cookie
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES: ${APPLE_CLIENT_ID}
    restart: unless-stopped

  backend:
    image: dockerregistry.icomb.place/archiver/backend:latest
    user: "${CONTAINER_USER:-1012:1012}"
    volumes:
      - archiver_store:/data/archiver_store
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?stringtype=unspecified
      DATASOURCE_USERNAME: ${DB_USER}
      DATASOURCE_PASSWORD: ${DB_PASSWORD}
      ARCHIVER_STORAGE_ROOT: /data/archiver_store
      ARCHIVER_PROCESSOR_TOKEN: ${PROCESSOR_TOKEN}
      ARCHIVER_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MCP_TOKEN: ${MCP_TOKEN}
      MCP_OAUTH_SIGNING_KEY_B64: ${MCP_OAUTH_SIGNING_KEY_B64}
      ARCHIVER_ESCALATION_CONFIDENCE_MIN: "0.70"
      ARCHIVER_ESCALATION_TEXT_MIN_CHARS: "200"
      ARCHIVER_ESCALATION_JUNK_RATIO_MAX: "0.25"
      ARCHIVER_ESCALATION_ENABLE_ABBYY: "false"
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBED_TEI_URL: ${EMBED_TEI_URL:-https://api.deepinfra.com/v1/openai}
      EMBED_TEI_KEY: ${EMBED_TEI_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-Embedding-8B}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-1024}
      QWEN_OCR_ENABLED: ${QWEN_OCR_ENABLED:-false}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://api.deepinfra.com/v1/openai}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_OCR_MODEL: ${QWEN_OCR_MODEL:-Qwen/Qwen2.5-VL-32B-Instruct}
      QWEN_OCR_CONCURRENCY: ${QWEN_OCR_CONCURRENCY:-1}
      OCR_DEFAULT_ENGINE: ${OCR_DEFAULT_ENGINE:-ocr_page_qwen3vl}
      MISTRAL_OCR_ENABLED: ${MISTRAL_OCR_ENABLED:-false}
      TRANSLATE_BATCH_ENABLED: ${TRANSLATE_BATCH_ENABLED:-false}
      TRANSLATE_RECORD_ENABLED: ${TRANSLATE_RECORD_ENABLED:-false}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai}
      MISTRAL_OCR_TICK_INTERVAL: ${MISTRAL_OCR_TICK_INTERVAL:-15000}
      MISTRAL_OCR_MAX_BATCH_BYTES: ${MISTRAL_OCR_MAX_BATCH_BYTES:-209715200}
      MISTRAL_OCR_PAGES_PER_MINUTE: ${MISTRAL_OCR_PAGES_PER_MINUTE:-1250}
    restart: unless-stopped

  frontend:
    image: dockerregistry.icomb.place/archiver/frontend:latest
    user: "${CONTAINER_USER:-1012:1012}"
    environment:
      BACKEND_URL: http://backend:8080
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: host
      # Search-answer synthesis over the retrieved passages.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai}
      SEARCH_ANSWER_MODEL: ${SEARCH_ANSWER_MODEL:-mistral-medium-latest}
    depends_on:
      - backend
    restart: unless-stopped

  scraper-cz:
    image: dockerregistry.icomb.place/archiver/scraper-cz:latest
    user: "${CONTAINER_USER:-1012:1012}"
    environment:
      BACKEND_URL: http://backend:8080
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN}
    depends_on:
      - backend
    restart: "no"

  embed-worker:
    image: dockerregistry.icomb.place/archiver/embed-worker:latest
    user: "${CONTAINER_USER:-1012:1012}"
    environment:
      BACKEND_URL: http://backend:8080
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN}
      EMBED_TEI_URL: ${EMBED_TEI_URL:-https://api.deepinfra.com/v1/openai}
      EMBED_TEI_KEY: ${EMBED_TEI_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-Embedding-8B}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-1024}
    depends_on:
      - backend
    restart: unless-stopped

  scraper-ebadatelna:
    image: dockerregistry.icomb.place/archiver/scraper-ebadatelna:latest
    user: "${CONTAINER_USER:-1012:1012}"
    environment:
      BACKEND_URL: http://backend:8080
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN}
      EBADATELNA_EMAIL: ${EBADATELNA_EMAIL:-}
      EBADATELNA_PASSWORD: ${EBADATELNA_PASSWORD:-}
    depends_on:
      - backend
    restart: "no"

  scraper-findbuch:
    image: dockerregistry.icomb.place/archiver/scraper-findbuch:latest
    user: "${CONTAINER_USER:-1012:1012}"
    environment:
      BACKEND_URL: http://backend:8080
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN}
      FINDBUCH_USERNAME: ${FINDBUCH_USERNAME:-}
      FINDBUCH_PASSWORD: ${FINDBUCH_PASSWORD:-}
    depends_on:
      - backend
    restart: "no"

  scraper-oesta:
    image: dockerregistry.icomb.place/archiver/scraper-oesta:latest
    user: "${CONTAINER_USER:-1012:1012}"
    environment:
      BACKEND_URL: http://backend:8080
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN}
    depends_on:
      - backend
    restart: "no"

  scraper-matricula:
    image: dockerregistry.icomb.place/archiver/scraper-matricula:latest
    user: "${CONTAINER_USER:-1012:1012}"
    environment:
      BACKEND_URL: http://backend:8080
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN}
    depends_on:
      - backend
    restart: "no"

  scraper-barch:
    image: dockerregistry.icomb.place/archiver/scraper-barch:latest
    user: "${CONTAINER_USER:-1012:1012}"
    environment:
      BACKEND_URL: http://backend:8080
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN}
    depends_on:
      - backend
    restart: "no"

  # entity-worker:
