spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:archiver}
    password: ${SPRING_DATASOURCE_PASSWORD:archiver}

  flyway:
    enabled: true
    clean-disabled: false

spring.ai.mcp.server:
  enabled: false

archiver:
  storage:
    root: ${java.io.tmpdir}/archiver-test-storage
  processor:
    token: test-processor-token
  mcp:
    oauth:
      # Throwaway CI/test-only 2048-bit RSA key, base64-encoded PKCS8 PEM. Never used outside
      # tests. Generate a new one with: openssl genrsa 2048 | base64 | tr -d '\n'
      signing-key-b64: ${MCP_OAUTH_SIGNING_KEY_B64:}
