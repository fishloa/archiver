spring:
  application:
    name: archiver-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/archiver?stringtype=unspecified
    username: archiver
    password: archiver
    hikari:
      maximum-pool-size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

server:
  port: 8080

spring.ai.mcp.server:
  name: archiver
  version: "1.0.0"
  type: SYNC
  protocol: STREAMABLE
  streamable-http:
    mcp-endpoint: /api/mcp/sse

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

archiver:
  storage:
    root: ${ARCHIVER_STORAGE_ROOT:/tmp/archiver-storage}
  processor:
    token: ${ARCHIVER_PROCESSOR_TOKEN:dev-processor-token}
  admin:
    # Static bearer token granting ROLE_ADMIN, for driving the archive from scripts and the
    # command line. Admin endpoints require USER or ADMIN, and those roles normally arrive via
    # OAuth2 login, which cannot be scripted. Unset means no token grants admin.
    token: ${ARCHIVER_ADMIN_TOKEN:}
  mcp:
    token: ${MCP_TOKEN:}
    oauth:
      signing-key-b64: ${MCP_OAUTH_SIGNING_KEY_B64:}
      issuer: ${MCP_OAUTH_ISSUER:https://archive.czernin.eu}
  auth:
    trusted-cidrs: ${AUTH_TRUSTED_CIDRS:127.0.0.1/32,::1/128,10.0.9.0/24,192.168.16.0/22}
    trusted-proxy-hosts: ${AUTH_TRUSTED_PROXY_HOSTS:web}
    trusted-peer-cache-seconds: ${AUTH_TRUSTED_PEER_CACHE_SECONDS:30}
  openai:
    api-key: ${OPENAI_API_KEY:}
  embed:
    tei-url: ${EMBED_TEI_URL:}
    tei-key: ${EMBED_TEI_KEY:}
    model: ${EMBED_MODEL:Qwen/Qwen3-Embedding-8B}
    dimensions: ${EMBED_DIMENSIONS:1024}
    query-prefix: "${EMBED_QUERY_PREFIX:Instruct: Given a research question, retrieve the archive passage that answers it\nQuery: }"
  translate-worker:
    url: ${TRANSLATE_WORKER_URL:http://translate-worker:8001}
  pdf:
    # Searchable PDFs are built in-process (see SearchablePdfWorker), not by a separate service.
    concurrency: ${PDF_CONCURRENCY:3}
    poll-interval: ${PDF_POLL_INTERVAL:5000}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
  ocr:
    default-engine: ${OCR_DEFAULT_ENGINE:ocr_page_qwen3vl}
    qwen:
      enabled: ${QWEN_OCR_ENABLED:false}
      base-url: ${QWEN_BASE_URL:https://api.deepinfra.com/v1/openai}
      api-key: ${QWEN_API_KEY:}
      model: ${QWEN_OCR_MODEL:Qwen/Qwen2.5-VL-32B-Instruct}
      poll-interval: ${QWEN_OCR_POLL_INTERVAL:5000}
      concurrency: ${QWEN_OCR_CONCURRENCY:1}
    mistral:
      enabled: ${MISTRAL_OCR_ENABLED:false}
      api-key: ${MISTRAL_API_KEY:}
      model: ${MISTRAL_OCR_MODEL:mistral-ocr-latest}
      base-url: ${MISTRAL_BASE_URL:https://api.mistral.ai}
      # Batch OCR: one worker, sized by bytes rather than by thread count.
      # How often the single worker runs its reconcile/collect/poll/submit pass.
      tick-interval: ${MISTRAL_OCR_TICK_INTERVAL:15000}
      # Upper bound on rows the size-aware claim considers; the byte budget decides the batch.
      max-batch-pages: ${MISTRAL_OCR_MAX_BATCH_PAGES:1000}
      # 200MB, under the provider's 250MB upload ceiling. Images are sent as scanned — billing
      # is per page, so downscaling would trade transcription quality for nothing.
      max-batch-bytes: ${MISTRAL_OCR_MAX_BATCH_BYTES:209715200}
      # Provider allowance; enforced from a 60-second window over ocr_batch.submitted_at.
      pages-per-minute: ${MISTRAL_OCR_PAGES_PER_MINUTE:1250}
  translate:
    batch:
      # Batched translation through the same provider batch API as OCR. The interactive path
      # took ~27s per page against a provider that queued concurrent requests rather than
      # parallelising them, making the archive a two-day job; the same model answers in under
      # two seconds uncontended, and batching removes the per-request overhead entirely.
      enabled: ${TRANSLATE_BATCH_ENABLED:false}
      model: ${TRANSLATE_BATCH_MODEL:mistral-small-latest}
      size: ${TRANSLATE_BATCH_SIZE:2000}
      pages-per-minute: ${TRANSLATE_BATCH_PAGES_PER_MINUTE:5000}
    record:
      # Catalogue metadata only. Deliberately separate from batch.enabled so turning titles on
      # cannot also arm re-translation of the whole archive's pages.
      enabled: ${TRANSLATE_RECORD_ENABLED:false}
    claude:
      enabled: ${CLAUDE_OCR_ENABLED:false}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_OCR_MODEL:claude-haiku-4-5-20251001}
      poll-interval: ${CLAUDE_OCR_POLL_INTERVAL:5000}
      concurrency: ${CLAUDE_OCR_CONCURRENCY:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/archiver_dev?stringtype=unspecified
    username: archiver
    password: archiver

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATASOURCE_POOL_SIZE:30}

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/archiver_test?stringtype=unspecified
    username: archiver
    password: archiver

  flyway:
    clean-disabled: false
