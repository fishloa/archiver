    - tabpanel "O aplikaci" [ref=f5e33]:
      - heading "eBadatelna Archivu bezpečnostních složek" [level=1] [ref=f5e34]
      - paragraph [ref=f5e35]: Elektronická badatelna Archivu bezpečnostních složek slouží k dálkovému nahlížení do archiválií dle zákona č. 499/2004 Sb., o archivnictví a spisové službě, a k zobrazování archivních pomůcek k archivním fondům našeho archivu. Jde jak o nové archivní pomůcky, tak o pomůcky, jež byly přepsány z tištěné verze. Najdete je pod záložkou „Fondy“. Pokud jsou již k jednotlivým inventárním jednotkám vloženy jejich digitální reprodukce, můžete je rovněž zobrazit. Zobrazení archivních pomůcek a vyhledávání v nich nevyžaduje registraci, nicméně po kliknutí na příslušný sken si aplikace vyžádá Vaši autorizaci. Pokud jste již v systému zaregistrovaní, stačí zadat Váš e-mail a heslo a můžete prohlížet archiválie bez omezení. Pokud doposud zaregistrováni nejste, postupujte, prosím, dle návodu v záložce „Nápověda“, kde jsou i další informace pro usnadnění práce s aplikací. Vyhledavač k fulltextovému prohledávání archivních pomůcek najdete pod záložkou „Hledání“.
      - heading "Novinky" [level=2] [ref=f5e36]
      - paragraph [ref=f5e37]: 15. 12. 2025 Vážení badatelé, do aplikace eBadatelna byla přidána část badatelsky velmi zajímavého archivního souboru Historický fond Státní bezpečnosti (H). Obsahuje převážně operativní a objektové svazky, které byly před archivací vyhodnoceny jako zvláště významné, ale zároveň i instruktivní a vhodné pro dokumentaci historického vývoje a činnosti čs. kontrarozvědky. Celkem bylo v eBadatelně nově zpřístupněno dalších 250 inventárních jednotek o více jak 166 000 skenech.
      - paragraph [ref=f5e38]: 8. 12. 2025 Vážení badatelé, do aplikace eBadatelna byly přidány digitální reprodukce fondu Rehabilitační spisy. Archiválie byly vyčleněny zejména ze sbírky vyšetřovacích spisů, ale i z dalších archivních souborů. Celkově bylo zpřístupněno 151 inventárních jednotek o více jak 37 000 skenech.
      - paragraph [ref=f5e39]: 1. 12. 2025 Vážení badatelé, do aplikace eBadatelna byly přidány digitální reprodukce vybraných archiválií z fondů okresních útvarů Státní bezpečnosti v bývalém Pražském kraji a ve Středočeském kraji (f. B 1). Nepochybně zajímavým historickým pramenem, který zpřístupňujeme, jsou například dochované památníky četnických stanic a stanic SNB. Obsahují různorodý materiál – kromě vlastních zápisů o událostech a jejich konceptů například i rozkazy, pokyny, dobové vyhlášky a další tiskoviny
      - paragraph [ref=f5e40]: 31. 3. 2025 Vážení badatelé, v rámci březnové aktualizace byly do eBadatelny nejprve přidány digitální reprodukce dalších 9775 svazků tajných spolupracovníků (A-VKR) z fondu Hlavní správa Vojenské kontrarozvědky – svazky. A na konci měsíce března se v aplikaci eBadatelna objevily digitální reprodukce části fondu Správy StB Praha Správy SNB hlavního města Prahy a Středočeského kraje (B 1, B 1/II). Nově je Vám k dispozici ke studiu více jak 345 000 skenů.
      - paragraph [ref=f5e41]: 21. 1. 2025 Vážení badatelé, do aplikace eBadatelna byla přidána část badatelsky velmi zajímavého archivního souboru Historický fond Státní bezpečnosti (H). Obsahuje převážně operativní a objektové svazky, které byly před archivací vyhodnoceny jako zvláště významné, ale zároveň i instruktivní a vhodné pro dokumentaci historického vývoje a činnosti čs. kontrarozvědky. Celkem bylo v eBadatelně nově zpřístupněno systematicky digitalizovaných prvních 250 inventárních jednotek o více jak 166 tisících skenech.
      - paragraph [ref=f5e42]: 16. 12. 2024 Vážení badatelé, do eBadatelny byla přidána druhá část objektových svazků bývalé civilní rozvědky (I. správy). Jde o dochované svazky s reg. č. v rozmezí 10100 až 10399. Zároveň do eBadatelny byla přidána další část osobních svazků kádrových příslušníků bývalé I. správy. A v neposlední řadě byl do eBadatelny dodán fond Kolegium ministra vnitra České socialistické republiky (f. H 4). Celkově bylo přidáno více jak 185 000 skenů.
      - paragraph [ref=f5e43]: "14. 10. 2024 Do eBadatelny byly přidány digitální reprodukce archivního fondu bývalého Studijního ústavu MV číslo 325: Stíhání nacistických válečných zločinců Státní bezpečností (1907) 1964–1990. Zpřístupněno je celkem 1832 inventárních položek v 72 tematických sériích. Celkem bylo přes eBadatelnu zpřístupněno 213 216 skenů archiválií z archivního fondu číslo 325."
      - paragraph [ref=f5e44]: 07. 10. 2024 Do eBadatelny jsme přidali digitální reprodukce čtyř vyšetřovacích spisů ze sbírky Správa vyšetřování StB – vyšetřovací spisy z centrálních útvarů ministerstva vnitra a ministerstva národní bezpečnosti (V/MV), které z hlediska studia dějin římskokatolické církve ve 20. století patří k nejvíce žádaným archiváliím. Jde o spisy arch. č. V-2844 MV („Augustin Machalka a spol.“), arch. č. V-3881 MV („Stanislav Zela a spol.“), arch. č. V-2309 MV („Štěpán Trochta a spol.“) a arch. č. V-2742 MV („Oto Mádr a spol.“).
      - paragraph [ref=f5e45]: 03. 09. 2024 Do eBadatelny byly přidány další digitální reprodukce vyšetřovacích spisů ze sbírky Správa vyšetřování StB – vyšetřovací spisy z bývalého Jihočeského kraje (V/CB), které byly v předchozích letech systematicky digitalizovány. Přidali jsme rozsah archivních jednotek od arch. č. V-1000 CB do arch. č. V-5627 CB. Nově bylo v eBadatelně zpřístupněno 4497 inventárních jednotek, což činí celkem 368 888 skenů.
      - paragraph [ref=f5e46]: 10. 06. 2024 Do eBadatelny byly přidány další digitální reprodukce vyšetřovacích spisů ze sbírky Správa vyšetřování StB – vyšetřovací spisy z bývalého Jihočeského kraje (V/CB), které byly v předchozích letech systematicky digitalizovány. Přidali jsme rozsah archivních jednotek od arch. č. V-501 CB do arch. č. V-999 CB. Celkem bylo v eBadatelně nově zpřístupněno 494 inventárních jednotek, což dělá 107 699 skenů.
      - paragraph [ref=f5e47]: 20. 05. 2024 Vážení badatelé, provedli jsme další aktualizaci eBadatelny. Nově do ní byly přidány svazky „řádu 2“ z fondu Hlavní správa rozvědky. V rámci této řady byly uloženy svazky obsahující písemnosti převážně z padesátých a šedesátých let minulého století. Celkem bylo v eBadatelně nově zpřístupněno 765 svazků.
      - paragraph [ref=f5e48]: 20. 03. 2024 Do eBadatelny byly přidány další digitální reprodukce vyšetřovacích spisů ze sbírky Správa vyšetřování StB – vyšetřovací spisy. Objem nově přidaných reprodukcí vyšetřovacích spisů čítá převážně archiválie z bývalého Jihočeského kraje (V/CB), které byly systematicky digitalizovány. Do aplikace eBadatelna byl přidán rozsah archivních čísel od V-1 CB do V-500 CB, tedy 493 inventárních jednotek. Zbylých 23 inventárních jednotek této sbírky – z dalších různých krajských útvarů Sboru národní bezpečnosti (V/BN, V/PL, V/OV, V/HK, V/UL, V/LB) – bylo vybráno ke zpřístupnění v aplikaci eBadatelna z toho důvodu, že se jedná o cenné archivní prameny s velkou historickou hodnotou, a jako takové, patří k často zpřístupňovaným a badateli žádaným archiváliím. Celkem bylo v eBadatelně nově zpřístupněno 516 inventárních jednotek o 146 579 skenech.
      - paragraph [ref=f5e49]: 12. 02. 2024 Vážení badatelé, do eBadatelny byla přidána první část objektových svazků bývalé civilní rozvědky (I. správy). Objektové svazky byly vedeny k různým zahraničním institucím, bezpečnostním složkám, firmám, komunitám československých emigrantů v cizině a dalším tématům (tzv. objektům), která spadala do oblasti zájmu rozvědky.
      - paragraph [ref=f5e50]: 20. 10. 2023 Do eBadatelny byly přidány digitální reprodukce inventárních jednotek fondů Studijní ústav Ministerstva vnitra (A 1), Odbor pro mezinárodní styky Federálního ministerstva vnitra (A 11) a Zpravodajský odbor Federální správy zpravodajské služby (A 18). Celkově bylo přidáno téměř 110 000 skenů.
      - paragraph [ref=f5e51]: 31. 7. 2023 Do eBadatelny byl přidán archivní soubor Zvláštní vyšetřovací spisy (ZV), který obsahuje téměř 185 000 skenů.
      - paragraph [ref=f5e52]: 14.4.2023 Do eBadatelny byla přidána archivní pomůcka archivního souboru Vojenské učiliště Pohraniční a Vnitřní stráže Bruntál (2353), která obsahuje 917 záznamů.
      - paragraph [ref=f5e53]: 30.3.2023 Do eBadatelny byl přidán archivní soubor Zvláštní operativní svazky (ZA), který obsahuje téměř 60 000 skenů. Nově je také možné přes záložku „media“ přehrávat audio a video soubory, které se občas v archiváliích vyskytují.
      - paragraph [ref=f5e54]: 14. 3. 2023 Do eBadatelny přidána první část osobních svazků kádrových příslušníků bývalé I. správy (civilní rozvědky). Svazky dokumentují nasazení rozvědčíků v zahraničí, kteří působili tzv. v legalizaci (jako členové diplomatických misí, zástupci podniků zahraničního obchodu, zahraniční zpravodajové atp.). V rámci této skupiny archiválií bylo v eBadatelně rovněž publikováno několik svazků nelegálních rozvědčíku – příslušníků rozvědky, kteří působili v zahraniční pod falešnou identitou. Celkem bylo v eBadatelně nově zpřístupněno 857 svazků (více než 220 000 skenů).
      - paragraph [ref=f5e55]: 31. 1. 2023 Do eBadatelny byly přidány digitální reprodukce sekretariátů náměstků MV a FMV Ludvíka Hlavačky, Karla Peprného (A 19) a Jaroslava Voseckého (A 20). Jedná se o necelých 6000 skenů.
      - paragraph [ref=f5e56]: 30. 12. 2022 Do eBadatelny byly přidány digitální reprodukce fondu Hlavního velitelství Veřejné bezpečnosti České socialistické republiky (HV VB). Fond obsahuje písemnosti a administrativní pomůcky z činnosti sekretariátu HV VB (např. bezpečnostní opatření, zprávy o bezpečnostní situaci v době výročí srpnových událostí 1968, zprávy o mimořádných událostech – pohřeb J. Palacha, sebevražda J. Zajíce, zprávy o kriminalitě), dozorčího útvaru (denní zprávy), inspekce náčelníka HV VB (stížnosti občanů, zprávy o prověrkách na útvarech), I. a II. odboru Správy kriminální služby a personálního a školského odboru. Zároveň byly přidány první archiválie ze sbírky Vyšetřovacích spisů (V-MV). V tomto případě se jedná o několik rozsáhlých spisů (např. k akci Střed, tedy Milada Horáková a spol., k Chartě 77 aj.), které byly badateli velmi často požadovány a z tohoto důvodu byly mimo pořadí zkontrolovány a částečně redigitalizovány. Celkem bylo přidáno přes 240 000 skenů.
      - paragraph [ref=f5e57]: 30. 11. 2022 Provedli jsme aktualizaci eBadatelny, do které byly přidány přepisy archivní pomůcky fondu Bezpečnostní složky MV (A 12) – celkem 276 záznamů – a digitální reprodukce fondu Sekretariát náměstka ministra vnitra plk. Demjana (A 24) – celkově téměř 20 000 skenů.
      - paragraph [ref=f5e58]: 24. 11. 2022 Provedli jsme aktualizaci eBadatelny, do které byly přidány přepisy archivních pomůcek útvarů Správy vězeňské stráže a sběrných, internačních a pracovních táborů a táborů nucených prací (tzv. E fondy) a další části fondu A 2 (A 2/10), který obsahuje poslední část rozkazů a nařízení FMV, především z 80. let. Nově je tak možno prohledávat více než 1500 záznamů těchto archivních souborů. Zároveň byly přidány digitální reprodukce části fondu A 2/10 – celkově přes 18 000 skenů.
      - paragraph [ref=f5e59]:
        - text: 1. 11. 2022 V eBadatelně byla zprovozněna funkce prohledávání textu naskenovaných archiválií pomocí OCR. Návod pro použití najdete
        - link "zde" [ref=f5e60] [cursor=pointer]:
          - /url: https://www.abscr.cz/wp-content/uploads/2022/10/1-ocr_navod-1.pdf
        - text: . Další informace a tipy pak na stránkách
        - link "archivu" [ref=f5e61] [cursor=pointer]:
          - /url: https://www.abscr.cz/ebadatelna/
        - text: .
      - paragraph [ref=f5e62]: 30. 9. 2022 Provedli jsme další velkou aktualizaci eBadatelny. Byly do ní přidány digitální reprodukce svazků kontrarozvědného rozpracování (KR-VKR) z fondu Hlavní správa Vojenské kontrarozvědky – svazky. Tyto archiválie byly vedeny k osobám, na které se ve sledovaném období z různých důvodů zaměřovali příslušníci Vojenské kontrarozvědky. V naprosté většině jde o svazky uložené na mikrografických předlohách. Nově je Vám ke studiu k dispozici 6616 svazků KR-VKR (téměř 570 000 skenů).
      - paragraph [ref=f5e63]: 11.8. 2022 Do eBadatelny jsme přidali inventář a digitální reprodukce fondu AKR 36 (Správa kontrarozvědky pro boj proti vnitřnímu nepříteli – X. správa SNB). Fond byl v minulosti již částečně jednou inventarizován pod značkou A 36. Pořádací práce sice nebyly ukončeny, ale z důvodů vysoké žádanosti byly archiválie pod inventárními jednotkami z tohoto soupisu rozsáhle zapůjčovány a citovány. Aby nedocházelo k omylům v citování, byla po novém uspořádání změněna značka fondu na nynější AKR 36. Fond obsahuje 1874 inventárních jednotek a téměř 130 000 skenů.
      - paragraph [ref=f5e64]: 28. 7. 2022 Provedli jsme drobnou aktualizaci a přidali fond Sekretariát náměstka FMV plk. JUDr. Františka Vaška (A 13) s cca 6700 skeny.
      - paragraph [ref=f5e65]: 30. 6. 2022 Provedli jsme aktualizaci eBadatelny, do které byly přidány digitální reprodukce inventárních jednotek fondu Sekretariát náměstka ministra vnitra plk. Jindřicha Kotala (A 5) a 543 svazků tajných spolupracovníků (TS-MV) a svazků kontrarozvědného rozpracování (KR-MV). Celkově jde o téměř 75 000 skenů.
      - paragraph [ref=f5e66]: 31. 3. 2022 Provedli jsme aktualizaci eBadatelny, do které byly přidány přepisy archivních pomůcek teritoriálních útvarů StB (tzv. B fondy). Nově je tak možno prohledávat více než 12 000 záznamů těchto archivních souborů. Zároveň byly přidány digitální reprodukce inventárních jednotek fondů Sekretariát náměstka ministra vnitra plk. Jaroslava Klímy (A 7) a Sekretariát I. náměstka ministra vnitra plk. Jana Záruby (A 9). Celkově se jedná o téměř 70 000 skenů.
      - paragraph [ref=f5e67]: 20. 10. 2021 Do eBadatelny přibylo 574 svazků z fondu tajných spolupracovníků MV (TS-MV). Celkem jde o více než 67 000 skenů.
      - paragraph [ref=f5e68]: 9. 8. 2021 Do eBadatelny byly nově přidány další dva digitalizované fondy. Jde o fond Zvláštní agenturní svazky (ZA) a fond Židovské organizace (425). Dále byly do eBadatelny přidány také přepisy archivních pomůcek fondů Veřejné bezpečnosti a MV ČSR, jejichž digitalizace zatím stále probíhá. Jedná se o fondy Hlavní velitelství VB ČSR (H 2, H 2/II), Organizační a vnitřní správa MV ČSR (H 3) a Kolegium MV ČSR (H 4). Celkově bylo přidáno přes 15 000 záznamů a přes 600 000 skenů.
      - paragraph [ref=f5e69]: "22. 6. 2021 Provedli jsme další aktualizaci eBadatelny. Nově v ní najdete podrobnější vyhledávání, které Vám usnadní nalezení archiválií v konkrétních fondech nebo podle specifického zadání – jedná se např. o omezovač fondů, lištu pro určení časového období datace archiválií, možnost prohledávání krycích názvů svazků a jiné. Více o nových možnostech se dozvíte v návodu a tipech přímo na stránce ebadatelna.cz. Byly přidány také další digitalizované archivní soubory: část fondu Organizační a vnitřní správa FMV (A 6/2) a fond Hlavní správa VB (H 1) – celkem téměř 500 000 skenů. Zcela nově byly do eBadatelny nahrány také přepisy některých archivních pomůcek k fondům útvarů Pohraniční stráže (téměř 7000 inventárních jednotek), které, jak doufáme, ulehčí zájemcům o tuto problematiku vyhledávání a objednávání archiválií."
      - paragraph [ref=f5e70]: 17. 3. 2021 Během roku 2020 byly dokončeny úpravy softwaru eBadatelny, které umožní jednodušší přidávání digitalizovaných archiválií a přepsaných archivních pomůcek. V průběhu roku se tak eBadatelna dočká výraznějšího rozšíření a změn ve vzhledu a vyhledávání. V tuto chvíli se jedná pouze o změnu ve struktuře archivních fondů, aby byla do budoucna přehlednější. Jednotlivé fondy jsou rozřazeny dle tématik, do nichž pak budou přibývat archivní pomůcky a digitální reprodukce. Zároveň byl přidán inventář Fondu Správy sledování (A 25), digitální reprodukce archiválií částí fondů Sekretariát FMV (A 2/5, A 2/7) a Organizační a vnitřní správa FMV (A 6/1, A 6/5) a dále množství digitálních reprodukcí archiválií svazkových fondů kontrarozvědného rozpracování a tajných spolupracovníků MV (KR-MV a TS-MV).
      - paragraph [ref=f5e71]:
        - text: 22. října 2019 Do eBadatelny jsme přidali možnost registrace/aktivace uživatelského účtu ryze elektronickou cestou, tedy bez nutnosti osobní návštěvy některé z našich badatelen (z důvodu ověření Vaší totožnosti). K tomuto účelu využíváme služeb portálu národního bodu pro identifikaci a autentizaci jako nástroje pro bezpečné a zaručené ověření totožnosti uživatele (
        - link "identitaobcana.cz" [ref=f5e72] [cursor=pointer]:
          - /url: https://www.identitaobcana.cz
        - text: "). K ověření totožnosti je možné v současné době použít dva identifikační prostředky: 1) občanský průkaz s aktivovaným čipem (vydaný po 1. 7. 2018) 2) uživatelský"
        - link "účet národní identitní autority" [ref=f5e73] [cursor=pointer]:
          - /url: https://info.identitaobcana.cz/ups/
        - text: Přejeme příjemné bádání!
      - paragraph [ref=f5e74]: 30. dubna 2018 Do eBadatelny jsme přidali obsáhlou skupinu (více než 460 000 skenů) digitálních reprodukcí archiválií z části sbírky Svazků kontrarozvědného rozpracování (KR-MV) – celkem 2645 svazků a ze sbírky Svazků tajných spolupracovníků (TS-MV) – celkem 2979 svazků, které jsou v archivu uloženy na mikrofiších. Jedná se o další část svazků z provenience Státní bezpečnosti (první část těchto svazků byla do eBadatelny vložena v roce 2017). Vzhledem k některým zákonným omezení se stále ještě nejedná o kompletní sbírku svazků tzv. centrálních útvarů MV. Do eBadatelny nejsou prozatím vloženy také svazky TS a KR archivované v jiných krajích (České Budějovice, Plzeň, Ústí, Hradec Králové, Brno, Ostrava). Nejsou zde rovněž tzv. Materiály trvalé hodnoty, které se dochovaly v papírové podobě. U svazků ze sbírky Svazků tajných spolupracovníků (TS-MV), je nutno zdůraznit, že pod tímto souborným názvem jsou nejen svazky agentů, rezidentů aj., kteří s StB spolupracovali vědomě, ale i svazky důvěrníků a kandidátů tajné spolupráce, které nejsou na základě nálezu Ústavního soudu, sp. zn. Pl. ÚS 1/92, kategoriemi vědomé spolupráce ve smyslu zákona č. 451/1991 Sb. (tzv. lustrační zákon), nejde tedy vždy o vědomé spolupracovníky bývalé Státní bezpečnosti. Podrobnější informace k jednotlivým kategoriím svazků najdete zde. Poznámka „Rozsudek“, uvedená u některých jmen, znamená, že k předmětnému svazku existuje pravomocný rozsudek příslušného soudu o neoprávněnosti evidence dané osoby jako spolupracovníka StB. Rozsudek je možné zpřístupnit na základě žádosti v badatelně archivu. Pokud zde hledaný svazek nenajdete, je vždy lepší obrátit se na Archiv bezpečnostních složek, který může existenci svazku ověřit ve vlastních databázích. Obracejte se na nás prostřednictvím žádanky či e-mailu na adresu info@abscr.cz.
      - heading "Co v eBadatelně najdete" [level=2] [ref=f5e75]
      - paragraph [ref=f5e76]:
        - text: Do eBadatelny jsou prozatím zařazovány plně digitalizované fondy, k nimž existují alespoň základní popisné informace, které umožní badatelům samostatnou orientaci. Z legislativních důvodů je pro registraci nutné ověření identity badatele buď během osobní návštěvy v „kamenné“ badatelně Archivu (pro toto ověření je vyžadován občanský průkaz nebo cestovní pas) nebo elektronickou cestou (více viz
        - link "ZDE" [ref=f5e77] [cursor=pointer]:
          - /url: /Content/eBadatelna-eidentifikace.pdf
        - text: ). Aktivace dálkového účtu pak platí po dobu jednoho roku. Pro další prodloužení je nezbytná opětovná osobní návštěva badatelny. Tento požadavek je analogií k režimu běžných badatelů, kteří každým rokem obnovují badatelský list.
      - paragraph [ref=f5e78]: Po dobu jednoho roku má zaregistrovaný badatel možnost studovat vybrané archiválie z libovolného počítače s internetovým připojením, vybaveného moderním prohlížečem (podporovány jsou Internet Explorer 9 a vyšší, Microsoft Edge, Chrome, Firefox a další). Do elektronického badatelského listu jsou automaticky zaznamenávány všechny inventární jednotky, do kterých uživatel nahlížel. Záznamy o prohlížených archiváliích ani osobní údaje uživatelů Archiv nepředává žádným dalším stranám a využívá je výhradně a v míře nezbytné pro naplnění požadavků zákona č. 499/2004 Sb.
      - paragraph [ref=f5e79]: Fondy i inventáře budou průběžně přibývat, o čemž Vás budeme informovat níže v části „Novinky“.
      - heading "Co v eBadatelně nenajdete" [level=2] [ref=f5e80]
      - paragraph [ref=f5e81]: Fondy Archivu bezpečnostních složek byly naneštěstí po řadu let digitalizovány chybnou metodikou a převážně bez dostačujícího popisu. Náprava tohoto stavu je mimořádně pracná, což nám bohužel neumožňuje zpřístupňovat veškeré digitalizované archiválie a tento stav potrvá ještě dlouho. V aplikaci eBadatelna tedy nebudou zpřístupněny fondy, které prozatím nemají dostatek popisných informací, nebo jejich digitalizace vykazuje tolik chyb, že by mohly badatele vést k chybným interpretacím. Intenzivně pracujeme na možnosti zpřístupnit další fondy a alespoň části doposud digitalizovaných svazků. Přestože jsme vybrali ke zpřístupnění fondy, které co do kvality a úplnosti považujeme za nejméně problematické, může se stát, že některé digitální reprodukce nebudou plně odpovídat originálu. V takovém případě je možné badatelům předložit originální archiválie, pokud to jejich fyzický stav dovolí.
      - heading "Náměty od uživatelů eBadatelny" [level=2] [ref=f5e82]
      - paragraph [ref=f5e83]:
        - text: Platforma eBadatelna.cz se má dále rozvíjet a budou v ní postupně přibývat další fondy Archivu bezpečnostních složek. Oceníme zpětnou vazbu, kterou zasílejte na adresu
        - link "ebadatelna@abscr.cz" [ref=f5e84] [cursor=pointer]:
          - /url: mailto:ebadatelna@abscr.cz
        - text: .
      - paragraph [ref=f5e85]: Přejeme Vám hodně badatelských úspěchů!
