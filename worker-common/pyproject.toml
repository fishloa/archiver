[project]
name = "worker-common"
version = "0.1.0"
description = "Shared library for archiver pipeline workers"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
]

[project.optional-dependencies]
# worker_common.pdf only. Kept out of the base dependencies so a scraper that never assembles
# a PDF (findbuch, barch) does not pull reportlab; the six that do already declare both.
pdf = [
    "Pillow>=10.0",
    "reportlab>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
